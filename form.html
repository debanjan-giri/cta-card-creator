<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Generated Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      /* Error styling for input fields */
      input.error,
      textarea.error,
      select.error {
        border-color: #dc3545 !important;
        box-shadow: 0 0 5px rgba(220, 53, 69, 0.3) !important;
        background-color: #fff5f5 !important;
      }

      /* Error styling for radio and checkbox groups */
      .radio-group.error,
      .checkbox-group.error {
        border: 2px solid #dc3545 !important;
        border-radius: 6px;
        padding: 8px;
        background-color: #fff5f5 !important;
      }

      /* Normal focus styling */
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
      }

      /* Override focus styling when field has error */
      input.error:focus,
      textarea.error:focus,
      select.error:focus {
        border-color: #dc3545 !important;
        box-shadow: 0 0 5px rgba(220, 53, 69, 0.5) !important;
      }

      .required {
        color: #dc3545;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-submit {
        background: #007bff;
        color: white;
      }
      .btn-cancel {
        background: #ccc;
      }

      /* Error message styling */
      .error-message {
        color: #dc3545;
        font-size: 12px;
        margin-top: 5px;
        display: none;
        font-weight: normal;
      }

      .error-message.show {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <h2>Please fill the form below</h2>
    <form id="dynamicForm" novalidate>
      <div class="form-group">
        <label for="name">name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          value=""
          placeholder="Enter name"
        />
        <div class="error-message" id="name-error">This field is required</div>
      </div>
      <div class="actions">
        <button type="button" class="btn-cancel" onclick="handleCancel()">
          Cancel
        </button>
        <button type="submit" class="btn-submit">Submit</button>
      </div>
    </form>
    <script>
      // Alternative simpler approach using URLSearchParams
      function getTokenFromURL(paramName) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(paramName) || "";
      }

      // Get token from URL parameter
      const token = getTokenFromURL("token");
      const env = getTokenFromURL("env");
      const ctaType = getTokenFromURL("ctaType");
      const id = getTokenFromURL("id");

      const form = document.getElementById("dynamicForm");

      // Function to validate form
      function validateForm() {
        let isValid = true;

        // Clear all previous errors first
        clearAllErrors();

        // Validate text inputs, textareas, and dropdowns
        const standardFields = form.querySelectorAll(
          'input[type="text"], input[type="number"], textarea, select'
        );
        standardFields.forEach(function (field) {
          const isRequired =
            field.closest(".form-group").querySelector(".required") !== null;
          if (isRequired && (!field.value || field.value.trim() === "")) {
            showFieldError(field);
            isValid = false;
          }
        });

        // Validate radio button groups
        const radioGroups = form.querySelectorAll(".radio-group");
        radioGroups.forEach(function (group) {
          const groupName = group.id.replace("-group", "");
          const isRequired =
            group.closest(".form-group").querySelector(".required") !== null;

          if (isRequired) {
            const checked =
              form.querySelectorAll('input[name="' + groupName + '"]:checked')
                .length > 0;

            if (!checked) {
              showRadioCheckboxGroupError(groupName);
              isValid = false;
            }
          }
        });

        // Validate checkbox groups
        const checkboxGroups = form.querySelectorAll(".checkbox-group");
        checkboxGroups.forEach(function (group) {
          const groupName = group.id.replace("-group", "");
          const isRequired =
            group.closest(".form-group").querySelector(".required") !== null;

          if (isRequired) {
            const checked =
              form.querySelectorAll('input[name="' + groupName + '"]:checked')
                .length > 0;

            if (!checked) {
              showRadioCheckboxGroupError(groupName);
              isValid = false;
            }
          }
        });

        return isValid;
      }

      function showFieldError(field) {
        field.classList.add("error");
        const errorElement = document.getElementById(field.name + "-error");
        if (errorElement) {
          errorElement.classList.add("show");
        }
      }

      function showRadioCheckboxGroupError(groupName) {
        const groupElement = document.getElementById(groupName + "-group");
        const errorElement = document.getElementById(groupName + "-error");

        if (groupElement) {
          groupElement.classList.add("error");
        }
        if (errorElement) {
          errorElement.classList.add("show");
        }
      }

      function clearFieldError(field) {
        field.classList.remove("error");
        const errorElement = document.getElementById(field.name + "-error");
        if (errorElement) {
          errorElement.classList.remove("show");
        }
      }

      function clearRadioCheckboxGroupError(groupName) {
        const groupElement = document.getElementById(groupName + "-group");
        const errorElement = document.getElementById(groupName + "-error");

        if (groupElement) {
          groupElement.classList.remove("error");
        }
        if (errorElement) {
          errorElement.classList.remove("show");
        }
      }

      function clearAllErrors() {
        // Clear all field errors
        form
          .querySelectorAll(".error")
          .forEach((el) => el.classList.remove("error"));
        form.querySelectorAll(".error-message").forEach((el) => {
          el.classList.remove("show");
        });
      }

      // Real-time validation as user types/selects
      function setupRealTimeValidation() {
        // Add input event listeners to remove error styles when user starts typing/selecting
        form
          .querySelectorAll("input, textarea, select")
          .forEach(function (field) {
            // For text inputs, textareas, and dropdowns
            if (field.type !== "radio" && field.type !== "checkbox") {
              // Clear error on input (as user types)
              field.addEventListener("input", function () {
                const isRequired =
                  this.closest(".form-group").querySelector(".required") !==
                  null;
                if (isRequired) {
                  if (this.value && this.value.trim() !== "") {
                    clearFieldError(this);
                  }
                }
              });

              // Also clear error on focus out if field has value
              field.addEventListener("blur", function () {
                const isRequired =
                  this.closest(".form-group").querySelector(".required") !==
                  null;
                if (isRequired) {
                  if (!this.value || this.value.trim() === "") {
                    showFieldError(this);
                  } else {
                    clearFieldError(this);
                  }
                }
              });

              // For dropdowns, also listen to change event
              if (field.tagName === "SELECT") {
                field.addEventListener("change", function () {
                  const isRequired =
                    this.closest(".form-group").querySelector(".required") !==
                    null;
                  if (isRequired) {
                    if (this.value && this.value.trim() !== "") {
                      clearFieldError(this);
                    }
                  }
                });
              }
            }

            // For radio and checkbox groups
            if (field.type === "radio" || field.type === "checkbox") {
              field.addEventListener("change", function () {
                const groupName = this.name;
                const groupElement = document.getElementById(
                  groupName + "-group"
                );
                const isRequired =
                  groupElement
                    .closest(".form-group")
                    .querySelector(".required") !== null;

                if (isRequired) {
                  // Check if any option in this group is selected
                  const isAnySelected =
                    form.querySelectorAll(
                      'input[name="' + groupName + '"]:checked'
                    ).length > 0;
                  if (isAnySelected) {
                    clearRadioCheckboxGroupError(groupName);
                  }
                }
              });
            }
          });
      }

      // Initialize real-time validation
      setupRealTimeValidation();

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Validate form first
        if (!validateForm()) {
          return;
        }

        // Check if token is available
        if (!token) {
          alert("Missing authentication token");
          return;
        }

        // Check if env is available
        if (!env || !ctaType || !id) {
          alert("Missing Important parameter");
          return;
        }

        const formData = {};
        new FormData(form).forEach((value, key) => {
          if (formData[key]) {
            formData[key] += "," + value; // handle checkboxes
          } else {
            formData[key] = value;
          }
        });

        const baseApi =
          env === "uat"
            ? "https://uat-apigl.clirnet.com/cta/cta_submitted_forms"
            : "https://apigl.clirnet.com/cta/cta_submitted_forms";

        try {
          const response = await fetch(baseApi, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: token,
            },
            body: JSON.stringify({
              cta_id: id,
              cta_type: ctaType,
              submitted_form_json: formData,
            }),
          });

          if (response.ok) {
            alert("Form submitted successfully!");
            form.reset();
            clearAllErrors(); // Clear errors after successful submission
          } else {
            alert("Submission failed");
          }
        } catch (err) {
          alert("Error submitting form");
          console.error(err);
        }
      });

      function handleCancel() {
        form.reset();
        clearAllErrors();
        alert("Form cancelled");
      }
    </script>
  </body>
</html>
